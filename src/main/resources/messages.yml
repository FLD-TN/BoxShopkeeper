  reason:
    not-found: 'không tìm thấy trong MMOItems'
    too-large: 'item quá lớn'
  unchanged: '<muted>%shop%: không có item MMOItems nào cần cập nhật'
  shop: '<success><text>%shop%<success>: đã cập nhật <text>%items% <success>item trong <text>%trades% <success>trade'
  shop-preview: '<muted>%shop%: sẽ cập nhật <text>%items% <muted>item trong <text>%trades% <muted>trade'
  done: '<success>Xong: <text>%items% <success>item trong <text>%shops% <success>mục chế tạo, đã tạo backup'
  preview-done: '<muted>Xem trước: <text>%items% <muted>item trong <text>%shops% <muted>mục chế tạo. Chưa ghi gì, chạy lại không có <text>preview <muted>để áp dụng'

currency:
