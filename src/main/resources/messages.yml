# Màu:
#   - Thẻ bảng màu: <text> <muted> <accent> <success> <error> (mã màu đặt ở gui.palette trong config.yml)
#   - RGB: <#FF8800>   hoặc   &#FF8800
#   - Màu có tên: <red> <gold> <aqua>...   hoặc mã cũ &a &6 &c...
#   - Kiểu chữ: <bold> <italic> <underlined> <strikethrough>   hoặc &l &o &n &m;  <reset> hoặc &r để về mặc định
#   - Chuyển màu: <gradient:#FF0000:#FFD479>chữ</gradient>   <rainbow>chữ</rainbow>
# Xuống dòng / dòng trống trong lore: viết dạng danh sách, '' là một dòng trống:
#   header:
#     - ''
#     - '<muted>Nguyên liệu'
#   hoặc viết \n trong chuỗi: header: '\n<muted>Nguyên liệu'
# Placeholder dạng %ten% không bao giờ bị đổi màu.
# Để trống một tin nhắn ('') thì tin nhắn đó sẽ không được gửi.

prefix: '&8(<#33FD42>&lB<#44F651>&lo<#55EF60>&lx<#65E96F>&lP<#76E27E>&lv<#87DB8D>&lP&r&8) '

trade:
  success: '<success>Trao đổi thành công %item%'
  not-enough: '<error>Không đủ nguyên liệu để trao đổi'
  inventory-full: '<error>Túi đồ không đủ chỗ trống'
  disabled: '<error>Trao đổi này hiện không khả dụng'
  changed: '<error>Trao đổi vừa được cập nhật, hãy thử lại'
  gamemode: '<error>Không thể trao đổi ở chế độ chơi này'
  state: '<error>Không thể trao đổi lúc này'
  # %need% %have% = số tiền theo màu của loại tiền (ví dụ 500$), %currency% = tên tiền
  not-enough-currency: '<error>Không đủ tiền: cần %need%<error>, đang có %have%'
  currency-unavailable: '<error><text>%currency% <error>tạm thời không khả dụng'
  currency-failed: '<error>Không trừ được <text>%currency%<error>, trao đổi đã hủy'

update:
  no-mmoitems: '<error>MMOItems chưa được cài hoặc chưa bật'
  incompatible: '<error>Phiên bản MMOItems không tương thích, xem console'
  locked: '<error><text>%shop% <error>đang được <text>%player% <error>chỉnh sửa, bỏ qua'
